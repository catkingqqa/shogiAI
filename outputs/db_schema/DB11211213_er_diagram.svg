<text x="90" y="95" font-family="Microsoft JhengHei, Noto Sans TC" font-size="20" font-weight="700" fill="#0F766E">RELATIONAL MODEL</text>
<text x="90" y="150" font-family="Microsoft JhengHei, Noto Sans TC" font-size="44" font-weight="700" fill="#1E2A3A">DB11211213 資料庫結構圖</text>
<text x="90" y="200" font-family="Microsoft JhengHei, Noto Sans TC" font-size="24" font-weight="400" fill="#5E6B7A">由 mysqldump --no-data 匯出的 schema 產生，呈現資料表、主鍵、外鍵與主要關聯。</text>
<line x1="470" y1="455" x2="690" y2="470" stroke="#7CA3D8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="528" y="454" font-family="Microsoft JhengHei, Noto Sans TC" font-size="17" font-weight="400" fill="#5E6B7A">1:N uploader</text>
<line x1="470" y1="785" x2="690" y2="590" stroke="#7CA3D8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="528" y="679" font-family="Microsoft JhengHei, Noto Sans TC" font-size="17" font-weight="400" fill="#5E6B7A">1:N black / white</text>
